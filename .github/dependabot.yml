# Smart Dependabot configuration for bootstrap-jft-github-actions.N0GjEH
# Automatically detected: github-actions
#
# NOTE: this file is synced to every falkcorp repo carrying
# .github/workflows/sync-from-template.yml. Edit it HERE, not downstream --
# the sync overwrites the downstream copy wholesale.

version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: friday
    time: "09:00"
    timezone: America/New_York
  open-pull-requests-limit: 5
  commit-message:
    prefix: ci
    include: scope
  labels:
  - dependencies
  - priority-high

# Git submodules -- .standards is the org-wide coding standards submodule
# (falkcorp/.github). A submodule is a PINNED COMMIT, not a live link, so a
# repo keeps consuming whatever standards existed the day it was added until
# something bumps the pin. Nothing did: as of 2026-08-30 all 15 repos synced
# from this template pinned .standards at a stale commit and none was current.
- package-ecosystem: gitsubmodule
  directory: /
  schedule:
    interval: weekly
    day: friday
    time: "09:00"
    timezone: America/New_York
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore
    include: scope
  labels:
  - dependencies
